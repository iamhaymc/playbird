# fly99 module registry (mirrors the built-in table; edit to rebalance or
# extend — entries here override matching ids and may add new modules).
# slot: engine | wings | hardpoint | bay | avionics | hull
# kind: -1 any, 0 plane, 1 drone
# visual: FLY_VIS_* bit value (see fly_sim.h)
# ord / cm: the name of a fly_ord_kind — rockets, bombs, seeker, dart, sam,
#           flares, chaff (see fly_ord.c, which owns what a round of each is).
#           `ord` makes the module a launcher and `cm` makes it a dispenser; a
#           module carries only the envelope, the warhead scale and the
#           magazine, so rebalancing a missile is one table and not fifteen
#           registry rows.
# beam_heat: >0 turns this module's gun into a beam — instant, a third the
#           cone, and it heats the airframe at this rate per second of fire.
# min_ilvl: lowest item level of ground or shelf this part turns up on (0 = anywhere)
# faction: four-letter power tag (CNCD CORS FNDY LNTN HLCN CNDR MRDN) for kit a
#          power builds for itself. Faction kit never drops and never appears on
#          an open shelf: it is sold over one power's own counter, to somebody
#          they think well enough of. Omit it for anything anybody can make.
#
# The handling block — pitch_mul, roll_mul, yaw_mul, wing_area_mul,
# wing_span_mul, cl_max_add, alpha_stall_add_deg, stability_mul, damping_mul,
# inertia_mul, spool_mul, torque_mul, g_limit_add — is what a fitted module
# does to the way the aeroplane flies rather than to what it can do. Every
# multiplier defaults to 1 when it is left out, so an entry says only what it
# changes. These are the numbers to reach for when a build is powerful and
# boring: a part that is worth fitting should be worth flying differently.
