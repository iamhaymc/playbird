  # --- the armed loadout ---------------------------------------------------
  # Nine parts, and the ladder they climb is min_ilvl rather than price. Tokens
  # accumulate, so price only ever delays a purchase where item level decides
  # whether a thing is on the shelf at all. Rockets, bombs and flares sit at
  # zero and are on the home apron from the first hour, because the day the
  # world gets missiles in it is the day a new operator has to be able to buy
  # the answer to one. Everything that follows a target of its own accord
  # starts at 25 and climbs.
  #
  # Every dispenser is fitted where the cargo would have gone. That is the
  # trade the whole loadout screen is made of: carrying the answer to a seeker
  # costs you the load that pays for the trip.
