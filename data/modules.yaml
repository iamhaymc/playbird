  # --- the rocket stack ---------------------------------------------------
  # Five parts across five slots, and none of them is optional: a motor with no
  # propellant is dead weight, propellant with no attitude control is a tumble,
  # and a craft that reaches space without a cabin or a shield gets there and
  # does not come back. Wanting all five at once costs the gun, the cargo racks,
  # the armour and the avionics, so going up is a build rather than a purchase.
  #
  # Rocket thrust is deliberately not scaled by air density — that single
  # difference is the whole gate on space. And min_ilvl keeps the stack on the
  # hard half of the map: without it a base is picked uniformly and a third of
  # every shelf in the world, including the starting apron's, is a rocket part.
  - id: rocket_motor
    name: Rocket Motor
    desc: 110 kN in vacuum, 4500 m/s exhaust
    slot: engine
    kind: 0
    cost: 5200
    mass_add: 260
    vne_add: 40
